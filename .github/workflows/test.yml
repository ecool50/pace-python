# Tests on every push and pull request, which is one of scverse's inclusion
# criteria and a good idea regardless.
#
# Eigen is downloaded at a pinned 3.4.0 rather than taken from the system.
# That is not fussiness: the fit reproduces the R package bit for bit only
# under Eigen 3.4, and 3.5 moves the random effects by about 3e-4. A runner
# image that silently upgraded would turn the fixture tests red with nothing
# to say why, or worse, pass a build that no longer agrees with R.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Fetch Eigen 3.4.0
        run: |
          curl -fsSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz -o eigen.tar.gz
          tar xzf eigen.tar.gz
          echo "EIGEN_INCLUDE_DIR=$PWD/eigen-3.4.0" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" -v

      - name: Test
        run: python -m pytest tests -q
