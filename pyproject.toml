[build-system]
requires = ["setuptools>=77", "pybind11>=2.10", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-spatial"
version = "0.1.0"
description = "PACE: proximity-associated changes in expression, for imaging spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Elijah Willie" }]
keywords = ["spatial transcriptomics", "single cell", "Xenium", "CosMx",
            "cell-cell interaction", "mixed models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# scipy carries the sparse matrices every stage reads; numpy everything else.
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
# pandas only for the .to_dataframe() views, anndata only for fit_anndata(),
# matplotlib only to draw. None of the three is needed to fit.
tables = ["pandas>=1.3"]
anndata = ["anndata>=0.8"]
plot = ["matplotlib>=3.5"]
test = ["pytest", "pandas>=1.3", "anndata>=0.8", "matplotlib>=3.5"]
all = ["pandas>=1.3", "anndata>=0.8", "matplotlib>=3.5"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "myst-parser>=2",
        "pandas>=1.3", "anndata>=0.8", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://ecool50.github.io/pace-python"
Documentation = "https://ecool50.github.io/pace-python"
Source = "https://github.com/ecool50/pace-python"
Issues = "https://github.com/ecool50/pace-python/issues"

[tool.setuptools]
packages = ["pace"]

[tool.setuptools.package-data]
pace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Wheels, so that installing PACE does not mean compiling it. Eigen is fetched
# and pinned at 3.4.0 by tools/fetch_eigen.sh: see that script for why the
# version is not negotiable.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
# musl and the minority architectures are not worth the build minutes until
# someone asks; 32-bit cannot hold a real cohort anyway.
skip = "*-musllinux_* *_i686 *_ppc64le *_s390x pp*"
before-all = "bash tools/fetch_eigen.sh"
environment = { EIGEN_INCLUDE_DIR = "$(pwd)/eigen-3.4.0" }
# A wheel that imports and fits is the least that should be checked; the full
# suite needs the fixtures, which the sdist deliberately leaves out.
test-requires = ["pytest", "pandas", "anndata", "matplotlib"]
test-command = "python -c \"import pace, numpy as np; from scipy.sparse import csc_matrix; r=np.random.default_rng(0); n=300; print(pace.pace_fit(csc_matrix(r.poisson(2,size=(n,10)).astype(float)), r.uniform(0,200,n), r.uniform(0,200,n), r.choice(['A','B'],n), n_threads=1))\""

[tool.cibuildwheel.macos]
# The R package needs Apple's toolchain and so does this: a Homebrew or conda
# clang drags in an old ld64 that links an unloadable extension.
environment = { EIGEN_INCLUDE_DIR = "$(pwd)/eigen-3.4.0", MACOSX_DEPLOYMENT_TARGET = "11.0" }
archs = ["x86_64", "arm64"]
