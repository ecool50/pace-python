# Build the documentation and publish it to GitHub Pages, as the R package's
# pkgdown workflow does for its site.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Eigen 3.4.0
        # The reference pages are generated from the installed package, so it
        # has to build, and the build refuses an Eigen that is not 3.4.
        run: |
          bash tools/fetch_eigen.sh
          echo "EIGEN_INCLUDE_DIR=$PWD/eigen-3.4.0" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"

      - name: Build
        # From outside the checkout, as the test workflow does and for the
        # same reason: the repository root holds the source package `pace/`,
        # which shadows the installed one on sys.path but carries no compiled
        # _core, and autodoc then fails with an ImportError that blames a
        # circular import.
        working-directory: ${{ runner.temp }}
        run: >
          python -m sphinx -b html
          "$GITHUB_WORKSPACE/docs" "$GITHUB_WORKSPACE/docs/_build/html"
          -W --keep-going

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
