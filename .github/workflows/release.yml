# Wheels and an sdist, on a tag. Publishing to PyPI is a separate, manual
# approval: the job that uploads waits on the `pypi` environment, so a tag
# alone cannot push a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No macos-13. The arm64 runner cross-compiles both macOS
        # architectures already -- [tool.cibuildwheel.macos] asks for
        # x86_64 and arm64 -- so an Intel runner only duplicates it, and
        # GitHub has retired those anyway: the job sat queued for an hour
        # and was never scheduled.
        #
        # The cost is that the x86_64 macOS wheels are cross-compiled and so
        # cannot be run on the builder; they are built but not test-fitted.
        # Every other wheel is.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          # The sdist needs no Eigen: it is sources, and the compile happens
          # on the installing machine.
          python -m pip install --upgrade build
          PACE_ALLOW_ANY_EIGEN=1 python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Trusted publishing: no token in the repository. Configure the publisher
    # on PyPI for this repo and workflow first, and approve the environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
